name: Actualiser les trophees GitHub
on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
concurrency: profile-trophy
jobs:
  update:
    if: github.server_url == 'https://github.com' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: soulteary/github-profile-trophy-action@v1
        with:
          options: 'username=EddyDem&theme=darkhub&no-bg=true'
          path: assets/trophy.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}
      - uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          file_pattern: assets/trophy.svg
          commit_message: 'chore: actualiser les trophees GitHub'
