<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="123.2" viewBox="0 0 1200 132" preserveAspectRatio="none">
  <defs>
    <linearGradient id="far" gradientUnits="userSpaceOnUse" x2="0" y1="8" y2="100">
      <stop stop-color="#664b95" stop-opacity=".58"/>
      <stop offset=".35" stop-color="#39275e" stop-opacity=".54"/>
      <stop offset="1" stop-color="#1e0a3f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mid" gradientUnits="userSpaceOnUse" x2="0" y1="43" y2="127">
      <stop stop-color="#8e60c5" stop-opacity=".68"/>
      <stop offset=".38" stop-color="#593480" stop-opacity=".77"/>
      <stop offset="1" stop-color="#27173c"/>
